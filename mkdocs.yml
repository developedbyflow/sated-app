site_name: Sated
site_description: A nutrition score that changes with your goal.
site_url: https://developedbyflow.github.io/sated-app/
repo_url: https://github.com/developedbyflow/sated-app
repo_name: developedbyflow/sated-app
edit_uri: ""

theme:
  name: material
  language: en
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      accent: amber
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Light mode
  features:
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - content.code.copy
    - search.suggest
    - search.highlight
    - toc.follow

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.inlinehilite
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

# Diataxis: four kinds of documentation, four folders.
# A new epic ADDS a line here. It never restructures this file.
nav:
  - Home: index.md
  - Explanation:
      - How a food becomes a letter: explanation/how-a-food-becomes-a-letter.md
      - What a food is to the engine: explanation/what-a-food-is.md
      - The four scores: explanation/the-four-scores.md
      - Why scores are relative: explanation/why-scores-are-relative.md
      - Architecture: explanation/architecture.md
      - The four gates: explanation/the-four-gates.md
      - Validation and its limits: explanation/validation.md
  - How-to:
      - Change the engine safely: how-to/change-the-engine-safely.md
  - Reference:
      - HTTP API: reference/http-api.md
      - Database: reference/database.md
  - Decisions:
      - Overview: decisions/index.md
      - 0001 - Fat quality is a component: decisions/0001-fat-quality-is-a-component-not-a-category-rule.md
      - 0002 - Added micronutrients count in full: decisions/0002-count-added-micronutrients-like-inherent-ones.md
      - 0003 - The HTTP layer is controllers: decisions/0003-controllers-over-minimal-apis.md
      - 0004 - Nutrients are an owned type: decisions/0004-nutrients-are-an-owned-type-on-food.md
      - 0005 - FNDDS is the catalogue: decisions/0005-fndds-is-the-catalogue.md
      - 0006 - Load the catalogue once, then own it: decisions/0006-load-the-catalogue-once-then-own-it.md
      - 0007 - Test the foods query against a real database: decisions/0007-test-the-foods-query-against-a-real-database.md
      - 0008 - The session lives in an HttpOnly cookie: decisions/0008-keep-the-session-in-an-httponly-cookie.md
      - 0009 - Consent is a document and a signature: decisions/0009-consent-is-a-document-and-a-signature.md
      - 0010 - Ask for the password before export and deletion: decisions/0010-ask-for-the-password-before-export-and-deletion.md
      - 0011 - A food belongs to one account: decisions/0011-a-food-belongs-to-one-account-or-to-the-catalogue.md
      - 0012 - Store the source of a row: decisions/0012-store-the-source-of-a-row-and-derive-the-rest.md
      - 0013 - A recipe derives its profile: decisions/0013-a-recipe-stores-its-parts-and-derives-everything-else.md
      - 0014 - USDA servings, sorted: decisions/0014-import-usda-servings-sorted-and-keep-the-default-apart.md
      - 0015 - Freeze the day and the grams: decisions/0015-freeze-the-day-and-the-grams-when-a-meal-is-logged.md
      - 0016 - Unpack a recipe when logged: decisions/0016-unpack-a-recipe-when-it-is-logged.md
      - Record template: decisions/_template.md
