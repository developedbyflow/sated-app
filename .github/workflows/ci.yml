name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      db:
        image: postgres:18
        env:
          POSTGRES_DB: sated
          POSTGRES_USER: sated
          POSTGRES_PASSWORD: sated
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sated -d sated"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Tests
        run: dotnet test server/Sated.slnx

      - name: Calibration gate G0
        working-directory: server/Sated.Calibration
        run: dotnet run
