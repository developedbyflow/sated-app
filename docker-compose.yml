services:
  db:
    image: postgres:18
    container_name: sated-db
    environment:
      POSTGRES_DB: sated
      POSTGRES_USER: sated
      POSTGRES_PASSWORD: sated
    ports:
      - "5432:5432"
    volumes:
      - sated-db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sated -d sated"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  sated-db-data:
